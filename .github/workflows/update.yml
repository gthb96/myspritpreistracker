name: Spritpreise abrufen

on:
  schedule:
    - cron: '7 * * * *'   # stündlich (UTC), Minute 7
  workflow_dispatch:       # manuell über den Actions-Tab startbar

permissions:
  contents: write

concurrency:
  group: spritpreise
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch.mjs
      - name: Daten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Spritpreise $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

